[package]
name = "duvy"
version = "0.1.0"
description = "Duvy - a fast native desktop media hub"
authors = ["Duvy contributors"]
edition = "2024"

[lib]
name = "duvy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "gzip",
  "brotli",
  "rustls-tls",
  "http2",
  "charset",
] }
tokio = { version = "1", features = [
  "process",
  "io-util",
  "time",
  "sync",
  "macros",
  "rt-multi-thread",
] }
url = "2"
sha2 = "0.10"
# rust-tls matches the app's reqwest setup; the HTTP API serves the local
# streaming endpoint and does not compile without tracing-subscriber-utils.
librqbit = { version = "9.0.1", default-features = false, features = [
  "rust-tls",
  "http-api",
  "tracing-subscriber-utils",
] }
librqbit-dualstack-sockets = "0.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
