[package]
name = "duvy"
version = "0.1.14"
description = "Duvy - a fast native desktop media hub"
authors = ["Duvy contributors"]
edition = "2024"

[lib]
name = "duvy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
# Playback runs inside this process; see build.rs for the import library.
libmpv2 = "7"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "gzip",
  "brotli",
  "rustls",
  "http2",
  "charset",
  "form",
  "query",
] }
tokio = { version = "1", features = [
  "process",
  "io-util",
  "time",
  "sync",
  "macros",
  "rt-multi-thread",
] }
url = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# A panicking thread must not take the whole app down: the mutex handlers
# already recover from poisoning, which only exists when unwinding is on.
panic = "unwind"
strip = true
