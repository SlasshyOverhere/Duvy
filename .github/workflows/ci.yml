name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run build

      - run: bun run test

      # Pinned: rust-cache keys on the rustc commit, so a stable bump wipes
      # every cache entry in the repo. Bump this deliberately.
      - uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # PRs restore main's cache; only main writes. Otherwise each PR saves
          # its own ~1 GB entry that no other ref can read.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The libmpv import library and DLL are not committed.
      - name: Fetch libmpv
        shell: pwsh
        run: ./scripts/fetch-libmpv.ps1

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # The release notes step is only reachable from a tag; check its fold here.
      - name: Release notes self-test
        shell: pwsh
        run: ./scripts/release-notes.ps1 -SelfTest
