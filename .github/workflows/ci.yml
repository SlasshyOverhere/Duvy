name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      - run: bun run check

      - run: bun run build

      - run: bun run test

      # Pinned: rust-cache hashes the rustc commit, so a moving toolchain wipes
      # every cache entry in the repo. Bump this deliberately.
      - uses: dtolnay/rust-toolchain@d5e4d57b030548f435d0befec15ff413a2c60eff # 1.100.0
        with:
          toolchain: 1.100.0
          components: clippy

      # rust-cache hashes `rustup toolchain list`, so a toolchain left behind by
      # the runner image rotates the cache key. Keep exactly one.
      - name: Drop extra toolchains
        shell: pwsh
        run: |
          rustup toolchain list --quiet | ForEach-Object {
            $name = ($_ -split ' ')[0]
            if ($name -and $name -notlike '1.100.0*') { rustup toolchain uninstall $name }
          }

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          # PRs restore main's cache; only main writes. Otherwise each PR saves
          # its own ~1 GB entry that no other ref can read.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The pinned-hash gate must reject a wrong checksum.
      - name: libmpv checksum self-test
        shell: pwsh
        run: ./scripts/fetch-libmpv.ps1 -SelfTest

      # The libmpv import library and DLL are not committed.
      - name: Fetch libmpv
        shell: pwsh
        run: ./scripts/fetch-libmpv.ps1

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml

      # The release notes step is only reachable from a tag; check its fold here.
      - name: Release notes self-test
        shell: pwsh
        run: ./scripts/release-notes.ps1 -SelfTest
