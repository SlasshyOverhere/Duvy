name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: bun install --frozen-lockfile

      # The tag is the version. Cargo, the Tauri config and the updater all read
      # it from here, so they can never disagree.
      - name: Set version from tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Tag '$env:GITHUB_REF_NAME' is not v<major>.<minor>.<patch>"
          }
          foreach ($file in 'package.json', 'src-tauri/tauri.conf.json') {
            (Get-Content $file -Raw) -replace '"version": "[^"]+"', "`"version`": `"$version`"" |
              Set-Content $file -NoNewline
          }
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "[^"]+"', "version = `"$version`"" |
            Set-Content src-tauri/Cargo.toml -NoNewline

          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1
          if ($conf.version -ne $version -or $cargo.Matches[0].Groups[1].Value -ne $version) {
            throw "version did not land in every manifest"
          }
          "Releasing $version"

      # Every commit since the last tag, so the release reads as a changelog
      # instead of just a PR list.
      - name: Collect commits since the previous release
        id: notes
        shell: pwsh
        run: |
          $prev = git tag --list 'v*' --sort=-v:refname | Where-Object { $_ -ne $env:GITHUB_REF_NAME } | Select-Object -First 1
          if ($prev) {
            $commits = git log "$prev..$env:GITHUB_REF_NAME" --no-merges --pretty='- %s (%h)'
            $heading = "### Commits since $prev"
            $compare = "https://github.com/$env:GITHUB_REPOSITORY/compare/$prev...$env:GITHUB_REF_NAME"
          } else {
            $commits = git log $env:GITHUB_REF_NAME --no-merges --pretty='- %s (%h)'
            $heading = "### Commits"
            $compare = "https://github.com/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_REF_NAME"
          }
          $body = (@($heading, '') + $commits + @('', "**Full changelog:** $compare")) -join "`n"
          "body<<EOF" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "EOF" >> $env:GITHUB_OUTPUT
          $body

      # Builds both installers, signs the updater bundles, publishes the release
      # and uploads latest.json, which is what the app's update endpoint reads.
      # mpv is not packaged; first run downloads it from the player release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A DSN is a public write-only ingest URL, not a secret. Set it as a
          # repository variable; empty means the build ships with reporting off.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: ${{ github.ref_name }}
          releaseName: Duvy ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
