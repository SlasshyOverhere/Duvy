name: Release

on:
  # A dispatch runs on main so the build cache lands in the default-branch
  # scope, the only one a later release can read. Caches are scoped per ref:
  # one saved under a tag is invisible to every other tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (e.g. 0.1.5)"
        required: true
  # Fallback: a tag still builds. It can read the main cache, not save one.
  push:
    tags: ["v*"]

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A dispatch builds the default branch, never whatever ref was picked.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'refs/heads/main' || github.ref }}

      - uses: oven-sh/setup-bun@v2

      # Must match ci.yml: the cache key carries the rustc commit.
      - uses: dtolnay/rust-toolchain@1.100.0

      # rust-cache hashes `rustup toolchain list`, so a toolchain left behind by
      # the runner image rotates the cache key. Keep exactly one.
      - name: Drop extra toolchains
        shell: pwsh
        run: |
          rustup toolchain list --quiet | ForEach-Object {
            $name = ($_ -split ' ')[0]
            if ($name -and $name -notlike '1.100.0*') { rustup toolchain uninstall $name }
          }

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # One key for every release, so the entry the last release saved is
          # found. CI keeps its own key: its debug artifacts would evict this.
          shared-key: release
          cache-on-failure: true
          # A tag run may read the main cache, but must not leave its own
          # orphan behind: only a dispatch writes.
          save-if: ${{ github.event_name == 'workflow_dispatch' }}

      - run: bun install --frozen-lockfile

      # A dispatch types the version, a tag carries it. Cargo, the Tauri config
      # and the updater all read it from here, so they can never disagree.
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:INPUT_VERSION) {
            $env:INPUT_VERSION.Trim() -replace '^v', ''
          } else {
            $env:REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "'$version' is not <major>.<minor>.<patch>"
          }
          # Only a dispatch can collide with an existing tag; a tag push is the tag.
          if ($env:INPUT_VERSION -and (git tag --list "v$version")) { throw "v$version is already tagged" }

          foreach ($file in 'package.json', 'src-tauri/tauri.conf.json') {
            (Get-Content $file -Raw) -replace '"version": "[^"]+"', "`"version`": `"$version`"" |
              Set-Content $file -NoNewline
          }
          (Get-Content src-tauri/Cargo.toml -Raw) -replace '(?m)^version = "[^"]+"', "version = `"$version`"" |
            Set-Content src-tauri/Cargo.toml -NoNewline

          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $cargo = Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"$' | Select-Object -First 1
          if ($conf.version -ne $version -or $cargo.Matches[0].Groups[1].Value -ne $version) {
            throw "version did not land in every manifest"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Releasing $version"

      # Pulls get GitHub's own bullets, and every commit in the range is listed
      # under them: a push that never became a PR still shows up in the notes.
      - name: Write release notes
        id: notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          ./scripts/release-notes.ps1

      # libmpv's import library and DLL are not committed, so every build
      # fetches them; the installer then bundles libmpv-2.dll beside the exe.
      - name: Fetch libmpv
        shell: pwsh
        run: ./scripts/fetch-libmpv.ps1

      # Builds both installers, signs the updater bundles, publishes the release
      # and uploads latest.json, which is what the app's update endpoint reads.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A DSN is a public write-only ingest URL, not a secret. Set it as a
          # repository variable; empty means the build ships with reporting off.
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          # A project key is a public write-only ingest key, not a secret.
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun run tauri
          tagName: v${{ steps.version.outputs.version }}
          releaseName: Duvy v${{ steps.version.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          # The body above is the whole story; generated notes would append a
          # second "What's Changed" and a second changelog link.
          generateReleaseNotes: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
