name: Bug report
description: Something broke, crashed, or behaved differently than expected.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not include API keys, tokens, passwords or personal data.
        Security problems go through the Security tab, not this form.
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings -> Update, or the installer name.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The shortest set of steps that shows the problem.
      placeholder: |
        1. Open a series
        2. Pick a stream
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the exact error text if there is one.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Playback issues: the last lines of `%APPDATA%\app.duvy.desktop\mpv.log` and
        `mpv-stderr.log`. Remove tokens and personal paths before pasting.
      render: text
    validations:
      required: false
  - type: dropdown
    id: source
    attributes:
      label: Where did the stream come from?
      options:
        - Direct HTTP link
        - Debrid
        - P2P / torrent
        - Jellyfin / Emby
        - Local file
        - Not a playback issue
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I am on the latest release.
          required: false
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no credentials or personal data.
          required: true
